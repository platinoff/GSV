<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-labelledby="gsvFlowTitle gsvFlowDesc">
  <title id="gsvFlowTitle">What to do after the server is up</title>
  <desc id="gsvFlowDesc">Open Galaxy UI, MCP attaches, type 01@0:0401@0, pick a product, drain. Animated SMIL pipeline.</desc>
  <defs>
    <linearGradient id="gsvFlowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
    <linearGradient id="gsvFlowPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7eb8ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c4a5ff" stop-opacity="0.15"/>
      <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.35;1.35;0.35" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="280" fill="url(#gsvFlowBg)"/>
  <text x="48" y="42" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="22" fill="#e8eef8">What to do next</text>
  <text x="48" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7c8ba3">The window being GSV does not pick the product  you do</text>
  <line x1="86" y1="150" x2="1194" y2="150" stroke="url(#gsvFlowPulse)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
    <g transform="translate(48 108)">
      <rect width="196" height="84" rx="12" fill="#101624" stroke="#7eb8ff" stroke-opacity="0.4"/>
      <text x="98" y="36" text-anchor="middle" font-size="14" fill="#e8eef8">Galaxy UI</text>
      <text x="98" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7c8ba3">:9999 dashboard</text>
      <circle cx="16" cy="16" r="5" fill="#22d3ee">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" begin="0s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(284 108)">
      <rect width="196" height="84" rx="12" fill="#101624" stroke="#7eb8ff" stroke-opacity="0.4"/>
      <text x="98" y="36" text-anchor="middle" font-size="14" fill="#e8eef8">MCP attaches</text>
      <text x="98" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7c8ba3">Cursor / OpenCode</text>
      <circle cx="16" cy="16" r="5" fill="#22d3ee">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(520 108)">
      <rect width="196" height="84" rx="12" fill="#101624" stroke="#c4a5ff" stroke-opacity="0.45"/>
      <text x="98" y="36" text-anchor="middle" font-size="14" fill="#e8eef8">01@0:0401@0</text>
      <text x="98" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7c8ba3">or abrakadabra</text>
      <circle cx="16" cy="16" r="5" fill="#c4a5ff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(756 108)">
      <rect width="196" height="84" rx="12" fill="#101624" stroke="#7eb8ff" stroke-opacity="0.4"/>
      <text x="98" y="36" text-anchor="middle" font-size="14" fill="#e8eef8">Pick a product</text>
      <text x="98" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7c8ba3">gsv  |  poolai  |  &</text>
      <circle cx="16" cy="16" r="5" fill="#22d3ee">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g transform="translate(992 108)">
      <rect width="196" height="84" rx="12" fill="#101624" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="98" y="36" text-anchor="middle" font-size="14" fill="#e8eef8">Drain</text>
      <text x="98" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7c8ba3">scan ' tests ' push</text>
      <circle cx="16" cy="16" r="5" fill="#22d3ee">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <text x="48" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#9aa8bd">Do not kill target/live/ before cargo test. Only stop target/debug/gsv-server.exe if that file is the listener.</text>
  <text x="48" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5b6b82">MCP folder scope GSV only  never User MCP (it leaks into PoolAI windows).</text>
</svg>
