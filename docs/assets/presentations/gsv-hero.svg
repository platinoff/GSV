<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img">
  <title>GSV - Galaxy StarWalker Vision</title>
  <desc>Rust-first vision server. Live UI at 127.0.0.1:9999. SMIL, no JavaScript.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060c"/>
      <stop offset="55%" stop-color="#06080f"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="nebA" cx="28%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#7eb8ff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#c4a5ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#06080f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="74%" cy="58%" r="46%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#c4a5ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0e18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7eb8ff"/>
      <stop offset="50%" stop-color="#e8eef8"/>
      <stop offset="100%" stop-color="#c4a5ff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <rect width="1280" height="400" fill="url(#nebA)">
    <animate attributeName="opacity" values="1;0.7;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect width="1280" height="400" fill="url(#nebB)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0.55" transform="translate(640 210)">
