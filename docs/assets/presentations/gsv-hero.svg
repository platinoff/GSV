<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="gsvHeroTitle gsvHeroDesc">
  <title id="gsvHeroTitle">GSV  Galaxy StarWalker Vision</title>
  <desc id="gsvHeroDesc">Animated galaxy banner. Rust-first vision server. Live UI at 127.0.0.1:9999. Pure SMIL, no JavaScript.</desc>
  <defs>
    <linearGradient id="gsvHeroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060c"/>
      <stop offset="55%" stop-color="#06080f"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="gsvHeroNebulaA" cx="28%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#7eb8ff">
        <animate attributeName="stop-opacity" values="0.28;0.14;0.28" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#c4a5ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#06080f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gsvHeroNebulaB" cx="74%" cy="58%" r="46%">
      <stop offset="0%" stop-color="#22d3ee">
        <animate attributeName="stop-opacity" values="0.10;0.22;0.10" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#c4a5ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0e18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gsvHeroWord" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7eb8ff"/>
      <stop offset="50%" stop-color="#e8eef8"/>
      <stop offset="100%" stop-color="#c4a5ff">
        <animate attributeName="stop-color" values="#c4a5ff;#22d3ee;#7eb8ff;#c4a5ff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="gsvHeroWipe">
      <rect x="0" y="0" width="1280" height="400">
        <animate attributeName="width" values="0;1280;1280" keyTimes="0;0.22;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="gsvHeroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="400" fill="url(#gsvHeroSky)"/>
  <rect width="1280" height="400" fill="url(#gsvHeroNebulaA)"/>
  <rect width="1280" height="400" fill="url(#gsvHeroNebulaB)"/>
  <g opacity="0.55" transform="translate(640 210)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-16" to="344" dur="48s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="280" ry="46" fill="none" stroke="#7eb8ff" stroke-opacity="0.22" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="180" ry="28" fill="none" stroke="#c4a5ff" stroke-opacity="0.18" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="96" ry="14" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1.5"/>
    </g>
  </g>
  <g fill="#c8dcff">
    <circle cx="86" cy="42" r="1.4" opacity="0.35"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.4s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="164" cy="88" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.12;0.9;0.12" dur="4.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="36" r="1.6" opacity="0.3"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="118" r="1.2" opacity="0.45"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.7s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="402" cy="58" r="1.0" opacity="0.5"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="486" cy="96" r="1.5" opacity="0.28"><animate attributeName="opacity" values="0.12;0.88;0.12" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="572" cy="28" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.16;1;0.16" dur="5.0s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="658" cy="74" r="1.1" opacity="0.35"><animate attributeName="opacity" values="0.14;0.82;0.14" dur="3.9s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="744" cy="44" r="1.7" opacity="0.32"><animate attributeName="opacity" values="0.1;0.92;0.1" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="102" r="1.2" opacity="0.38"><animate attributeName="opacity" values="0.18;0.86;0.18" dur="4.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="916" cy="52" r="1.4" opacity="0.42"><animate attributeName="opacity" values="0.12;1;0.12" dur="3.5s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="1002" cy="86" r="1.0" opacity="0.3"><animate attributeName="opacity" values="0.2;0.78;0.2" dur="4.8s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="1088" cy="38" r="1.6" opacity="0.36"><animate attributeName="opacity" values="0.14;0.94;0.14" dur="3.1s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1174" cy="70" r="1.2" opacity="0.4"><animate attributeName="opacity" values="0.16;0.84;0.16" dur="4.0s" begin="0.45s" repeatCount="indefinite"/></circle>
    <circle cx="1228" cy="120" r="1.3" opacity="0.28"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.6s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="96" cy="310" r="1.1" opacity="0.3"><animate attributeName="opacity" values="0.12;0.8;0.12" dur="4.4s" begin="0.25s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="348" r="1.4" opacity="0.34"><animate attributeName="opacity" values="0.18;0.92;0.18" dur="3.3s" begin="0.85s" repeatCount="indefinite"/></circle>
    <circle cx="1104" cy="328" r="1.2" opacity="0.32"><animate attributeName="opacity" values="0.14;0.88;0.14" dur="4.2s" begin="0.55s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="356" r="1.5" opacity="0.26"><animate attributeName="opacity" values="0.1;0.86;0.1" dur="3.8s" begin="1.3s" repeatCount="indefinite"/></circle>
  </g>
  <g clip-path="url(#gsvHeroWipe)" filter="url(#gsvHeroGlow)">
    <text x="80" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="92" font-weight="700" fill="url(#gsvHeroWord)" letter-spacing="6">GSV</text>
  </g>
  <text x="80" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#c4a5ff" letter-spacing="3.2">GALAXY STARWALKER VISION</text>
  <text x="80" y="252" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="18" fill="#9aa8bd">Rust-first vision server  |  Galaxy UI  |  MCP  |  VDT kit</text>
  <g transform="translate(80 286)">
    <rect width="228" height="36" rx="18" fill="#0e1624" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="22" cy="18" r="6" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;7;5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e8eef8">live 127.0.0.1:9999</text>
  </g>
  <g transform="translate(328 286)">
    <rect width="168" height="36" rx="18" fill="#121826" stroke="#7eb8ff" stroke-opacity="0.35"/>
    <text x="18" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7eb8ff">Rust 95100%</text>
  </g>
  <g transform="translate(516 286)">
    <rect width="210" height="36" rx="18" fill="#121826" stroke="#c4a5ff" stroke-opacity="0.35"/>
    <text x="18" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#c4a5ff">01@0:0401@0 / drain</text>
  </g>
  <g transform="translate(80 350)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text fill="#5b6b82">$</text>
    <text x="18" fill="#7c8ba3">cargo xtask live</text>
    <rect x="168" y="-12" width="8" height="16" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="900" fill="#5b6b82">SMIL  |  no JS  |  GitHub plays this</text>
  </g>
</svg>
