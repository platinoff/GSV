  </g>
  <g transform="translate(516 286)">
    <rect width="210" height="36" rx="18" fill="#121826" stroke="#c4a5ff" stroke-opacity="0.35"/>
    <text x="18" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#c4a5ff">abrakadabra / drain</text>
  </g>
  <g transform="translate(80 350)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
