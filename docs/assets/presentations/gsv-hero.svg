    <circle cx="1002" cy="86" r="1.0"><animate attributeName="opacity" values="0.2;0.78;0.2" dur="4.8s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="1088" cy="38" r="1.6"><animate attributeName="opacity" values="0.14;0.94;0.14" dur="3.1s" begin="1.2s" repeatCount="indefinite"/></circle>
