  <text x="80" y="214" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#c4a5ff" letter-spacing="3.2">GALAXY STARWALKER VISION</text>
  <text x="80" y="252" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="18" fill="#9aa8bd">Rust-first vision server  |  Galaxy UI  |  MCP  |  VDT kit</text>
  <g transform="translate(80 286)">
    <rect width="228" height="36" rx="18" fill="#0e1624" stroke="#22d3ee" stroke-opacity="0.45"/>
    <circle cx="22" cy="18" r="6" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.25;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#e8eef8">live 127.0.0.1:9999</text>
