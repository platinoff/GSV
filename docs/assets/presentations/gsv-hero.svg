    <rect x="168" y="-12" width="8" height="16" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="900" fill="#5b6b82">SMIL  |  no JS  |  no filter</text>
