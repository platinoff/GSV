# Project overlay for Grok CLI (`grok inspect`).
# Only [mcp_servers] / [plugins] / [permission] belong here.
# Stdio is the live copy (`cargo xtask live` copies gsv-mcp next to gsv-server).
# Do not `cargo run --bin gsv-mcp` — that fights the cargo lock and is slow.

[mcp_servers.gsv_mcp_openbot]
command = "S:/rust/GSV/target/live/gsv-mcp.exe"
args = ["--repo-root", "S:/rust/GSV"]
enabled = true
startup_timeout_sec = 15
