<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Galaxy StarWalker Vision</title>
  <desc id="desc">Static legend of layers L0–L5. Live graph is the colored chips under this poster on the Vision Map card. Nodes are docs or Rust files. Arrows are implements / session-tracks.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="50%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#3d5a8a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06080f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planeL0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a7ab8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e3350" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="planeL1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a8a50" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a4030" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="planeL2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a08040" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#403520" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="planeL3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a05078" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#402030" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="planeL4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d8a88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e4040" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="planeL5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a5aa0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a2048" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c4a5ff"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#nebula)"/>

  <g fill="#e8f0ff" opacity="0.5">
    <circle cx="120" cy="80" r="1"/><circle cx="980" cy="120" r="1.2"/>
    <circle cx="200" cy="200" r="0.8"/><circle cx="1050" cy="280" r="1"/>
    <circle cx="80" cy="400" r="1"/><circle cx="1100" cy="500" r="0.9"/>
    <circle cx="400" cy="60" r="0.7"/><circle cx="700" cy="680" r="1.1"/>
  </g>

  <text x="600" y="36" text-anchor="middle" fill="#eef2ff" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">Galaxy StarWalker Vision</text>
  <text x="600" y="58" text-anchor="middle" fill="#8b9cb8" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Static layer poster — live graph is the colored chips under this picture</text>

  <g transform="translate(200, 78)" filter="url(#shadow)">
    <path d="M0 72 L340 0 L680 72 L340 144 Z" fill="url(#planeL0)" stroke="#90b8f0" stroke-width="2"/>
    <text x="340" y="80" text-anchor="middle" fill="#c8dcff" font-size="14" font-weight="700">L0 Concept</text>
    <g filter="url(#glow)">
      <rect x="200" y="28" width="280" height="40" rx="8" fill="#1a2848" stroke="#a78bfa" stroke-width="2"/>
      <text x="340" y="54" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">GSV_GALAXY_GRID</text>
    </g>
    <text x="120" y="54" text-anchor="middle" fill="#9ab0d0" font-size="10">MEMORY</text>
    <text x="560" y="54" text-anchor="middle" fill="#9ab0d0" font-size="10">ROLES</text>
  </g>

  <g transform="translate(220, 198)" filter="url(#shadow)">
    <path d="M0 60 L280 0 L560 60 L280 120 Z" fill="url(#planeL1)" stroke="#90c490" stroke-width="1.5"/>
    <text x="280" y="70" text-anchor="middle" fill="#d0f0d0" font-size="13" font-weight="600">L1 Operations</text>
    <text x="170" y="50" text-anchor="middle" fill="#fff" font-size="11">HANDOFF</text>
    <text x="390" y="50" text-anchor="middle" fill="#fff" font-size="11">NEXT_SESSION</text>
  </g>

  <g transform="translate(200, 300)" filter="url(#shadow)">
    <path d="M0 60 L300 0 L600 60 L300 120 Z" fill="url(#planeL2)" stroke="#c4b080" stroke-width="1.5"/>
    <text x="300" y="70" text-anchor="middle" fill="#f0e8c0" font-size="13" font-weight="600">L2 Catalog</text>
    <text x="180" y="50" text-anchor="middle" fill="#fff" font-size="11">GSV_BOXES</text>
    <text x="420" y="50" text-anchor="middle" fill="#fff" font-size="11">PRODUCTS</text>
  </g>

  <g transform="translate(180, 402)" filter="url(#shadow)">
    <path d="M0 60 L320 0 L640 60 L320 120 Z" fill="url(#planeL3)" stroke="#c49ab0" stroke-width="1.5"/>
    <text x="320" y="70" text-anchor="middle" fill="#f0d0e0" font-size="13" font-weight="600">L3 Code</text>
    <text x="160" y="50" text-anchor="middle" fill="#fff" font-size="10">boxes/*.rs</text>
    <text x="320" y="50" text-anchor="middle" fill="#fff" font-size="10">server/mod.rs</text>
    <text x="480" y="50" text-anchor="middle" fill="#fff" font-size="10">mcp.rs</text>
  </g>

  <g transform="translate(210, 504)" filter="url(#shadow)">
    <path d="M0 52 L260 0 L520 52 L260 104 Z" fill="url(#planeL4)" stroke="#80d0c8" stroke-width="1.5"/>
    <text x="260" y="60" text-anchor="middle" fill="#d0f8f4" font-size="13" font-weight="600">L4 Libs</text>
    <text x="160" y="42" text-anchor="middle" fill="#fff" font-size="10">xtask</text>
    <text x="360" y="42" text-anchor="middle" fill="#fff" font-size="10">crates</text>
  </g>

  <g transform="translate(240, 592)" filter="url(#shadow)">
    <path d="M0 48 L230 0 L460 48 L230 96 Z" fill="url(#planeL5)" stroke="#c0b0f0" stroke-width="1.5"/>
    <text x="230" y="56" text-anchor="middle" fill="#e8e0ff" font-size="13" font-weight="600">L5 Workspace</text>
    <text x="140" y="38" text-anchor="middle" fill="#fff" font-size="10">GSV</text>
    <text x="320" y="38" text-anchor="middle" fill="#fff" font-size="10">poolAI</text>
  </g>

  <g fill="none" stroke="#c4a5ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.75">
    <path d="M540 200 L540 260"/>
    <path d="M540 300 L540 360"/>
    <path d="M540 400 L540 460"/>
    <path d="M540 500 L540 552"/>
    <path d="M540 590 L540 640"/>
  </g>

  <g transform="translate(48, 88)" font-family="Segoe UI, system-ui, sans-serif" font-size="11">
    <text x="0" y="0" fill="#eef2ff" font-weight="600" font-size="12">Layers</text>
    <rect x="0" y="12" width="12" height="12" rx="2" fill="#3d6a9e"/><text x="18" y="22" fill="#9aa0a6">L0 Concept</text>
    <rect x="0" y="32" width="12" height="12" rx="2" fill="#3d6a4a"/><text x="18" y="42" fill="#9aa0a6">L1 Operations</text>
    <rect x="0" y="52" width="12" height="12" rx="2" fill="#8a7040"/><text x="18" y="62" fill="#9aa0a6">L2 Catalog</text>
    <rect x="0" y="72" width="12" height="12" rx="2" fill="#8a4068"/><text x="18" y="82" fill="#9aa0a6">L3 Code</text>
    <rect x="0" y="92" width="12" height="12" rx="2" fill="#3d8a88"/><text x="18" y="102" fill="#9aa0a6">L4 Libs</text>
    <rect x="0" y="112" width="12" height="12" rx="2" fill="#6a5aa0"/><text x="18" y="122" fill="#9aa0a6">L5 Workspace</text>
    <text x="0" y="150" fill="#a78bfa">arrows = implements</text>
  </g>

  <g transform="translate(930, 88)" font-family="Segoe UI, system-ui, sans-serif">
    <rect x="0" y="0" width="230" height="168" rx="10" fill="#12182a" stroke="#3a4a68" stroke-width="1"/>
    <text x="16" y="28" fill="#eef2ff" font-size="13" font-weight="700">How to read</text>
    <text x="16" y="52" fill="#9aa0a6" font-size="11">This picture is a legend.</text>
    <text x="16" y="70" fill="#9aa0a6" font-size="11">Chips below = live nodes.</text>
    <text x="16" y="88" fill="#9aa0a6" font-size="11">Click a layer to filter.</text>
    <text x="16" y="106" fill="#9aa0a6" font-size="11">Search by id or path.</text>
    <text x="16" y="132" fill="#c4a5ff" font-size="11">Result opens Doc Preview.</text>
    <text x="16" y="152" fill="#8b9cb8" font-size="11">Hover any chip for a tip.</text>
  </g>

  <text x="600" y="742" text-anchor="middle" fill="#6a7a9a" font-family="Segoe UI, system-ui, sans-serif" font-size="12">L0 idea → L5 workspace · poster only · live counts are on the Vision Map card</text>
</svg>
