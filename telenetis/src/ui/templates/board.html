<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="app.title">Telenetis - Ticket Board</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="preload" href="/api/snapshot?lang=en" as="fetch" crossorigin>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="platform-unknown">
    <div id="app">
        <nav class="nav">
            <a href="/" data-i18n="nav.home">Home</a>
            <a href="/board" data-i18n="nav.board">Board</a>
            <a href="/flows" data-i18n="nav.flows">Flows</a>
            <a href="/roles" data-i18n="nav.roles">Roles</a>
            <a href="/workers" data-i18n="nav.workers">Workers</a>
            <a href="/vm" data-i18n="nav.vm">My VM</a>
            <a href="/chat" data-i18n="nav.chat">Chat</a>
        </nav>
        <h1 data-i18n="nav.board">Ticket Board</h1>
        <p class="dim">build 2026-09-14d</p>
        <table id="board">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Product</th>
                    <th>Claimed By</th>
                    <th data-i18n="board.actions">Actions</th>
                </tr>
            </thead>
            <tbody id="board-body" data-area="board" aria-busy="true">
                <tr data-skeleton="board" aria-hidden="true">
                    <td colspan="6"><div class="skeleton skeleton-row"></div></td>
                </tr>
                <tr data-skeleton="board" aria-hidden="true">
                    <td colspan="6"><div class="skeleton skeleton-row"></div></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
