<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="app.title">Telenetis</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="preload" href="/api/snapshot?lang=en" as="fetch" crossorigin>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="platform-unknown">
    <div id="app">
        <h1 data-i18n="app.title">Telenetis</h1>
        <p class="subtitle" data-i18n="app.subtitle">Telegram Mini App for GSV Godfather Channel</p>
        <div id="status" class="status" data-i18n="status.loading">Loading...</div>
        <nav class="tabs" id="tabs">
            <a href="/board" class="tab" data-i18n="nav.board">Board</a>
            <a href="/flows" class="tab" data-i18n="nav.flows">Flows</a>
            <a href="/roles" class="tab" data-i18n="nav.roles">Roles</a>
            <a href="/probe" class="tab">Probe</a>
            <a href="/tensor" class="tab">Tensor</a>
        </nav>
        <div id="tickets" data-area="tickets" aria-busy="true">
            <div class="skeleton skeleton-row" data-skeleton="tickets" aria-hidden="true"></div>
            <div class="skeleton skeleton-row" data-skeleton="tickets" aria-hidden="true"></div>
            <div class="skeleton skeleton-row" data-skeleton="tickets" aria-hidden="true"></div>
        </div>
        <div id="workers" data-area="workers" aria-busy="true">
            <div class="skeleton skeleton-row" data-skeleton="workers" aria-hidden="true"></div>
            <div class="skeleton skeleton-row" data-skeleton="workers" aria-hidden="true"></div>
        </div>
    </div>
    <script>
    // Deep-link entry: t.me startapp links always open this default page,
    // so a `probe` start_param hops straight to the WebGPU probe page.
    // Runs on load AND on return from background: a minimized WebView keeps
    // stale DOM (no reload), so resume re-checks the param too.
    (function () {
        function maybeProbe() {
            try {
                var w = window.Telegram && window.Telegram.WebApp;
                var p = w && w.initDataUnsafe && w.initDataUnsafe.start_param;
                if (String(p || "").toLowerCase() === "probe" &&
                    location.pathname !== "/probe") {
                    location.replace("/probe");
                }
            } catch (e) {}
        }
        maybeProbe();
        document.addEventListener("visibilitychange", function () {
            if (!document.hidden) { maybeProbe(); }
        });
    })();
    </script>
    <script src="/static/app.js"></script>
</body>
</html>
