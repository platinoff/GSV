[package]
name = "telenetis"
version = "0.1.0"
edition = "2021"
description = "Telegram Mini App + Bot for GSV Godfather channel coordination"

[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "native-tls"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
dotenvy = "0.15"
hmac = "0.13"
sha1 = "0.10"
sha2 = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# WS client for the phone-emulator P2P scenario (already in the lock file
# via axum's ws stack — no new native deps).
tokio-tungstenite = "0.29"

[[bin]]
name = "telenetis-live"
path = "src/bin/telenetis_live.rs"
